<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect — Gülsen Namıduru</title>
    <link rel="canonical" href="index.html">
    <script src="index/index.js?v=202604241300"></script>
</head>
<body>
    <p style="padding: 40px; font-family: sans-serif; font-size: 14px;">Redirecting…</p>
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = parseInt(urlParams.get('id'), 10);
            const project = portfolioData.projects.find(function (p) {
                return p.id === projectId;
            });
            if (project) {
                window.location.replace(getProjectPageHref(project));
                return;
            }
            window.location.replace('index.html');
        })();
    </script>
</body>
</html>
