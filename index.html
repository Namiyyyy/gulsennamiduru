<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gülsen Namıduru</title>
    <link rel="stylesheet" href="index/index.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><span>g</span><span>ü</span><span>l</span><span>s</span><span>e</span><span>n</span><span>n</span><span>a</span><span>m</span><span>ı</span><span>d</span><span>u</span><span>r</span><span>u</span></h1>
            <div class="cv-link">
                <span id="cv-link">about</span><span class="separator">.</span><span id="cv-page-link">cv</span><span class="separator">.</span><span id="contact-link">contact</span>
            </div>
            <div class="cv-link">
                <span id="photography-link">photography</span><span class="separator">.</span><span id="video-link">video</span><span class="separator">.</span><span id="sculpture-link">art in public space</span>
            </div>
        </header>

        <main>
            <div class="index-column">
                <ul id="portfolio-index" class="portfolio-index">
                    <!-- Will be populated by JavaScript -->
                </ul>
            </div>
        </main>

        <!-- Project popup (same structure as about/contact modals) -->
        <div id="popup-modal" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header popup-header-rows">
                    <div class="detail-header-row">
                        <h2 id="popup-title"></h2>
                        <a href="#" id="close-popup" class="action-link" aria-label="Close">×</a>
                    </div>
                    <div class="detail-header-row">
                        <span id="popup-medium-year" class="popup-medium-year"></span>
                    </div>
                    <div class="detail-header-row">
                        <span id="popup-short-description" class="popup-short-description"></span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="image-slideshow" id="image-slideshow">
                        <div id="slideshow-container" class="slideshow-container"></div>
                        <div class="slideshow-controls">
                            <button id="prev-slide" class="slide-btn">‹</button>
                            <span id="slide-counter" class="slide-counter"></span>
                            <button id="next-slide" class="slide-btn">›</button>
                        </div>
                    </div>
                    <div class="book-view" id="book-view">
                        <div class="book-spread">
                            <div class="book-page book-page-left"><img alt="Left page" /></div>
                            <div class="book-spine"></div>
                            <div class="book-page book-page-right"><img alt="Right page" /></div>
                        </div>
                        <div class="book-controls" role="navigation" aria-label="PDF spread navigation">
                            <button type="button" id="book-prev" class="slide-btn" aria-label="Previous spread">‹ Previous</button>
                            <span id="book-spread-counter" class="slide-counter" aria-live="polite"></span>
                            <button type="button" id="book-next" class="slide-btn" aria-label="Next spread">Next ›</button>
                        </div>
                        <p class="book-loading" id="book-loading">Loading…</p>
                    </div>
                    <div class="video-section" id="video-section"></div>
                    <div class="popup-text" id="popup-full-description"></div>
                    <div class="popup-credentials" id="popup-credentials"></div>
                </div>
            </div>
        </div>

        <!-- Full Detail View (separate page) -->
        <div id="detail-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <div>
                        <h2 id="detail-title"></h2>
                        <span id="detail-view-medium" class="medium-tag"></span>
                    </div>
                    <a href="#" id="close-detail" class="action-link">close</a>
                </div>

                <div class="detail-images" id="detail-images">
                    <!-- Images and description will be inserted here -->
                </div>
            </div>
        </div>

        <!-- CV View -->
        <div id="cv-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>about</h2>
                    <a href="#" id="close-cv" class="action-link">close</a>
                </div>

                <div class="cv-content" id="cv-content">
                    <!-- CV content will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Contact View -->
        <div id="contact-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>contact</h2>
                    <a href="#" id="close-contact" class="action-link">close</a>
                </div>

                <div class="cv-content" id="contact-content">
                    <!-- Contact content will be inserted here -->
                </div>
            </div>
        </div>

        <!-- CV Page View -->
        <div id="cv-page-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>cv</h2>
                    <a href="#" id="close-cv-page" class="action-link">close</a>
                </div>

                <div class="cv-content" id="cv-page-content">
                    <!-- CV page content will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Photography View -->
        <div id="photography-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>photography</h2>
                    <a href="#" id="close-photography" class="action-link">close</a>
                </div>

                <div class="cv-content" id="photography-content">
                    <!-- Photography content will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Video View -->
        <div id="video-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>video</h2>
                    <a href="#" id="close-video" class="action-link">close</a>
                </div>

                <div class="cv-content" id="video-content">
                    <!-- Video content will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Sculpture/Installation View -->
        <div id="sculpture-view" class="modal detail-modal">
            <div class="modal-content detail-content">
                <div class="detail-header">
                    <h2>art in public space</h2>
                    <a href="#" id="close-sculpture" class="action-link">close</a>
                </div>

                <div class="cv-content" id="sculpture-content">
                    <!-- Sculpture/Installation content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="index/index.js"></script>
</body>
</html>
